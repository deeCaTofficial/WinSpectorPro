name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия, на которой ведётся разработка: линтер и сборка используют её.
  PRIMARY_PYTHON: "3.14"

jobs:
  lint:
    name: Линтер
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip

      - name: Установка ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ scripts/ tests/

      - name: ruff format
        run: ruff format --check src/ scripts/ tests/

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница из pyproject и актуальная версия.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты с покрытием
        # Тесты GUI требуют offscreen-платформы: на раннере нет дисплея.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --cov --cov-report=xml --cov-report=term

      - name: Публикация отчёта о покрытии
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Пробная сборка
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Сборка исполняемого файла
        run: python scripts/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: WinSpectorPro-dist
          # EXE и его контрольная сумма: хеш публикуется в описании релиза.
          path: |
            dist/WinSpectorPro.exe
            dist/WinSpectorPro.exe.sha256
          if-no-files-found: error
