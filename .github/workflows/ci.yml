name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ scripts/ tests/

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница из pyproject и актуальная версия.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты с покрытием
        # Тесты GUI требуют offscreen-платформы: на раннере нет дисплея.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --cov --cov-report=xml --cov-report=term

      - name: Публикация отчёта о покрытии
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Пробная сборка
    runs-on: windows-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Сборка исполняемого файла
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: WinSpectorPro-dist
          path: dist/WinSpectorPro.exe
          if-no-files-found: error
