# ===================================================================
# Конфигурация Pytest для проекта WinSpector Pro
# ===================================================================
# Настройки покрытия (source/omit) вынесены в pyproject.toml, секция
# [tool.coverage]: ключи вида `cov_paths` в pytest.ini не существуют и
# молча игнорировались.

[pytest]

# Пути для импорта: тесты видят пакет из папки 'src'
pythonpath = . src
testpaths = tests
minversion = 8.0

# -ra:              отчёт по всем непройденным тестам
# --strict-markers: неизвестный маркер — ошибка, а не опечатка в тесте
# --strict-config:  ошибка в этом файле не должна проходить незамеченной
addopts = -ra --strict-markers --strict-config --color=yes

# Асинхронные тесты не требуют декоратора @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error::RuntimeWarning
    ignore::DeprecationWarning

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    slow: тесты, выполняющиеся долго
    gui: тесты, требующие PyQt
    windows: тесты, работающие только на Windows
