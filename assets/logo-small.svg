<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Отрисовка логотипа для 16–24 px: плитка во всю клетку, штрихи толще. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A78EE"/>
      <stop offset="1" stop-color="#2255CC"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <g transform="translate(256 268) scale(1.16) translate(-258 -244)" fill="none"
     stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="112,196 178,338 240,226 300,338" stroke-opacity="0.7"/>
    <polyline points="240,226 300,338 404,150"/>
  </g>
</svg>
